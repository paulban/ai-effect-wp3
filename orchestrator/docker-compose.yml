services:
  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  api:
    container_name: orchestrator-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Bound to the loopback interface: vendors reach this through the node's
      # proxy on 443, and operators through an SSH tunnel. Publishing it on all
      # interfaces would put an unauthenticated-by-default API on the network.
      - "127.0.0.1:18000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - HOST=0.0.0.0
      - PORT=8000
      - ORCHESTRATOR_API_KEY=${ORCHESTRATOR_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    # Joined to the shared network so the node's session proxy can route
    # vendor workflow submissions to it. Still not published to the host.
    networks:
      - default
      - services
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "worker_daemon.py"]
    environment:
      - REDIS_URL=redis://redis:6379
      - WORKER_POLL_INTERVAL=1.0
      - ORCHESTRATOR_API_KEY=${ORCHESTRATOR_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 3
    networks:
      - default
      - services
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  services:
    name: ai-effect-services
    external: true
