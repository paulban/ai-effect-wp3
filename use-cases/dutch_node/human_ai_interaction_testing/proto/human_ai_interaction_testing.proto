syntax = "proto3";
package dutch.human_ai_interaction_testing;

// ---------------------------------------------------------------------------
// Session lifecycle phases — progress monotonically, never go backwards.
// ---------------------------------------------------------------------------
enum SessionPhase {
  SESSION_PHASE_UNSPECIFIED = 0;
  SESSION_PHASE_PENDING     = 1;  // session created; container not yet ready
  SESSION_PHASE_GUI_READY   = 2;  // InteractiveAI container is up and reachable
  SESSION_PHASE_IN_PROGRESS = 3;  // operator has started interacting with the GUI
  SESSION_PHASE_SURVEY      = 4;  // grid episode ended; hmisurveys survey is shown
  SESSION_PHASE_COMPLETED   = 5;  // operator submitted survey; results written to volume
  SESSION_PHASE_FAILED      = 6;  // timeout elapsed or container error
}

// ---------------------------------------------------------------------------
// Input messages — what the AI vendor fills out in the testing template.
// ---------------------------------------------------------------------------

// ScenarioConfig selects the testing scenario.
// Leave name empty to use InteractiveAI's built-in default scenario.
// Future milestone: name can reference a scenario from the data synthesizer.
message ScenarioConfig {
  string name     = 1;  // "" = use InteractiveAI default
  map<string, string> metadata = 10;
}

// AgentConfig selects the AI agent to evaluate.
// Leave name empty to use the agent already integrated in InteractiveAI.
// Future milestone: source_uri / source_bytes for vendor-uploaded agents.
message AgentConfig {
  string name     = 1;  // "" = use InteractiveAI built-in agent
  map<string, string> metadata = 10;
}

// SurveyConfig selects which hmisurveys questionnaire to show.
// Leave survey_id empty to use the default survey bundled with InteractiveAI.
message SurveyConfig {
  string survey_id = 1;  // "" = use InteractiveAI / hmisurveys default
  map<string, string> metadata = 10;
}

// HumanAISessionSpec is the top-level input submitted by the AI vendor.
// All fields are required; the service validates them before launching.
message HumanAISessionSpec {
  ScenarioConfig scenario               = 1;
  AgentConfig    agent                  = 2;
  SurveyConfig   survey                 = 3;
  repeated string kpis                  = 4;  // KPI names to collect; empty = collect all
  int32 session_timeout_seconds         = 5;  // must be > 0
  map<string, string> metadata          = 10;
}

// ---------------------------------------------------------------------------
// RPC response messages
// ---------------------------------------------------------------------------

message StartSessionResponse {
  bool   success    = 1;
  string message    = 2;
  string session_id = 3;  // stable identifier for this session
  string gui_url    = 4;  // browser URL for the InteractiveAI grid simulation
  string survey_url = 5;  // browser URL for the hmisurveys questionnaire (separate container)
}

message SessionStatusRequest {
  string session_id = 1;
}

message SessionStatusResponse {
  bool         success       = 1;
  string       message       = 2;
  string       session_id    = 3;
  SessionPhase phase         = 4;
  string       error_message = 5;  // non-empty only when phase == FAILED
}

// MetricValue — mirrors benchmarking.proto so results are structurally
// identical across the WP3 evaluation services.
message NumericSeries {
  repeated double values = 1;
}

message StringAttributes {
  map<string, string> values = 1;
}

message MetricValue {
  oneof kind {
    double          scalar     = 1;
    NumericSeries   series     = 2;
    string          text       = 3;
    StringAttributes attributes = 4;
  }
}

message SessionResultRequest {
  string session_id = 1;
}

// SessionResultResponse carries both grid performance KPIs (from InteractiveAI)
// and survey outcomes (from hmisurveys). Keys are taken directly from the
// results JSON produced by the InteractiveAI container — never hardcoded here.
message SessionResultResponse {
  bool   success    = 1;
  string message    = 2;
  string session_id = 3;
  map<string, MetricValue> kpis            = 4;
  map<string, MetricValue> survey_outcomes = 5;
  map<string, string>      metadata        = 10;
}

// ---------------------------------------------------------------------------
// Service definition
// ---------------------------------------------------------------------------
service HumanAIInteractionTestingService {
  // Start a new human-AI interaction testing session.
  // Launches InteractiveAI and hmisurveys as separate containers.
  // Returns immediately with session_id, gui_url, and survey_url; the session runs async.
  rpc StartHumanAISession(HumanAISessionSpec)    returns (StartSessionResponse);

  // Poll the phase of a running session.
  rpc GetSessionStatus(SessionStatusRequest)      returns (SessionStatusResponse);

  // Retrieve results once the session has reached COMPLETED.
  // Returns a gRPC error if the session is not yet complete.
  rpc GetSessionResult(SessionResultRequest)      returns (SessionResultResponse);
}
