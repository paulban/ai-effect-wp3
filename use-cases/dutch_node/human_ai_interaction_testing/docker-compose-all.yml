services:
  hai-testing-service:
    image: paulban/aieffect-dutchnode-hai-testing:latest
    build:
      context: ..
      dockerfile: human_ai_interaction_testing/Dockerfile
    container_name: tef-hai-testing-service
    ports:
      - "8005:8080"
      - "50055:50051"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - SELF_URL=http://hai-testing-service:8080
      - GRPC_HOST=hai-testing-service
      - GRPC_PORT=50051
      # --- InteractiveAI container ---
      # Docker image for the InteractiveAI grid simulation GUI.
      # TODO (OQ-4): Build locally from AI4REALNET/InteractiveAI and set this.
      - HAI_INTERACTIVE_AI_IMAGE=${HAI_INTERACTIVE_AI_IMAGE:-interactiveai:latest}
      # Host port where the InteractiveAI web-app will be served.
      # TODO (OQ-5): Confirm the correct port by running InteractiveAI locally.
      - HAI_INTERACTIVE_AI_PORT=${HAI_INTERACTIVE_AI_PORT:-8090}
      # URL returned as gui_url. On Linux: replace host.docker.internal with host IP.
      - HAI_GUI_BASE_URL=${HAI_GUI_BASE_URL:-http://host.docker.internal:8090}
      # --- hmisurveys container ---
      # Docker image for the hmisurveys survey UI.
      # TODO (OQ-4): Build locally from AI4REALNET/hmisurveys and set this.
      - HAI_HMISURVEYS_IMAGE=${HAI_HMISURVEYS_IMAGE:-hmisurveys:latest}
      # Host port where the hmisurveys survey UI will be served.
      # TODO (OQ-7): Confirm the correct port by running hmisurveys locally.
      - HAI_HMISURVEYS_PORT=${HAI_HMISURVEYS_PORT:-8091}
      # URL returned as survey_url. On Linux: replace host.docker.internal with host IP.
      - HAI_SURVEY_BASE_URL=${HAI_SURVEY_BASE_URL:-http://host.docker.internal:8091}
      # --- Shared results directory ---
      # Host-absolute path for per-session result directories.
      # Must match the left side of the volume mount below.
      - HAI_RESULTS_HOST_PATH=${HAI_RESULTS_HOST_PATH:-/tmp/hai_sessions}
      # Path inside this container where the results directory is mounted.
      - HAI_RESULTS_CONTAINER_PATH=/hai-sessions
      - HAI_DOCKER_NETWORK=ai-effect-services
    volumes:
      # Docker socket — required for the service to launch and remove sub-containers.
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared results directory — both InteractiveAI (kpis.json) and
      # hmisurveys (survey_outcomes.json) write here; WP3 polls for both files.
      # The host path must match HAI_RESULTS_HOST_PATH above.
      - ${HAI_RESULTS_HOST_PATH:-/tmp/hai_sessions}:/hai-sessions
    networks:
      - services
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  services:
    name: ai-effect-services
    external: true
