# Dutch node — synthetic grid generation.
#
# Build from this directory: `docker compose up -d --build`. The build context
# is ../ (use-cases/) so the shared control-plane package can be copied into the
# image alongside the service's own code.
#
# The service is reached two ways. The orchestrator's workers dial it on the
# shared network at the address the exported dockerinfo.json names —
# synthetic-data:8080 — and that is the path all real work takes.
#
# It also publishes a host port, so a result reference is fetchable from this
# machine with nothing else running. That is a development convenience and it
# contradicts FR-19 and FR-27, which exist so that the node exposes exactly one
# port however many services it grows. The binding is loopback-only to keep the
# blast radius at this machine, and SYNTHESIZER_SELF_URL puts the proxy route
# back for a deployment that has one.

services:
  synthetic-data:
    build:
      context: ./services/data_synthesizer/
      additional_contexts:
        - common=../common
      dockerfile: Dockerfile
    # image: ghcr.io/ai-effect/dutch-node-data-synthesizer:latest
    container_name: synthetic-data
    restart: unless-stopped
    environment:
      # Bearer token on /control/*. Unset means open, which is acceptable only
      # on a developer machine.
      - SERVICE_API_KEY=${SERVICE_API_KEY:-}
      # Where a result reference points. Defaults to the published host
      # port, so the synthesized grid is fetchable with no proxy involved. Set
      # SYNTHESIZER_SELF_URL to the public route — e.g.
      # https://node.example.org/svc/synth — when deploying behind the
      # node's proxy, or the reference names an address no vendor can reach.
      - SELF_URL=${SYNTHESIZER_SELF_URL:-http://localhost:${SYNTHESIZER_HOST_PORT:-8003}}
      - ARTIFACT_DIR=/artifacts
      - MAX_CONCURRENT_JOBS=${SYNTHESIZER_MAX_CONCURRENT_JOBS:-1}
    ports:
      # Loopback only. This is a developer affordance, not a way to reach
      # the service from the network — the orchestrator does not use it.
      - "127.0.0.1:${SYNTHESIZER_HOST_PORT:-8003}:8080"
    volumes:
      # Results outlive the container so a restart mid-study does not lose a
      # completed benchmark.
      - synthesizer_artifacts:/artifacts
    networks:
      - services
    deploy:
      resources:
        limits:
          # Grid generation is CPU-bound. Capping it keeps the live human-AI
          # sessions sharing the host responsive (FR-26).
          cpus: "${SYNTHESIZER_CPU_LIMIT:-2.0}"
          memory: ${SYNTHESIZER_MEMORY_LIMIT:-4G}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  synthesizer_artifacts:

networks:
  services:
    name: ai-effect-services
    external: true
