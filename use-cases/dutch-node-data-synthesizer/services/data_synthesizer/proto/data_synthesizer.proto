syntax = "proto3";
package dutch.data_synthesizer;

enum LoadingLevel {
  LOADING_LEVEL_UNSPECIFIED = 0;
  LOADING_LEVEL_LOW = 1;
  LOADING_LEVEL_MEDIUM = 2;
  LOADING_LEVEL_HIGH = 3;
}

message LevelSpec {
  int32 n = 1;
  double avg_k = 2;
  int32 diam = 3;
  string dist_type = 4;
  int32 max_k = 5;
}

message Int32List {
  repeated int32 values = 1;
}

message ArtifactReference {
  string protocol = 1;
  string uri = 2;
  string format = 3;
  string media_type = 4;
  map<string, string> metadata = 10;
}

message InterLevelConnection {
  int32 from_level = 1;
  int32 to_level = 2;
  string type = 3;
  double c = 4;
  double gamma = 5;
  map<string, string> metadata = 10;
}

message TransformerDegreePair {
  int32 from_level = 1;
  int32 to_level = 2;
  repeated int32 source_degrees = 3;
  repeated int32 target_degrees = 4;
  map<string, string> metadata = 10;
}

message GridSynthesisRequest {
  repeated LevelSpec level_specs = 1;
  repeated InterLevelConnection connections = 2;
  int32 seed = 3;
  LoadingLevel loading_level = 4;
  int32 ref_sys_id = 5;
  map<string, string> metadata = 10;
}

message GridSynthesisConfig {
  repeated Int32List degrees_by_level = 1;
  repeated int32 diameters_by_level = 2;
  repeated TransformerDegreePair transformer_degrees = 3;
  repeated InterLevelConnection connections = 4;
  int32 seed = 5;
  LoadingLevel loading_level = 6;
  int32 ref_sys_id = 7;
  map<string, string> metadata = 10;
}

// GridData carries the synthesized grid as a native pandapower JSON snapshot.
// Using pandapower's own serialisation format avoids a lossy intermediate
// representation and lets the benchmark service call pp.from_json() directly.
//
// TODO (time series): pandapower JSON does not include time-varying load/gen
// profiles. Until the data_synthesizer generates real time series the benchmark
// service will fall back to a flat static profile derived from the operating
// point. Add a time_series_json field (or a separate RPC) once the synthesizer
// can produce load curves.
message GridData {
  string grid_id = 1;
  string pandapower_json = 2;  // raw output of pandapower.to_json(net)
  int32 seed = 4;
  string loading_level = 5;
  int32 ref_sys_id = 6;
  GridSynthesisConfig source_config = 7;
  map<string, string> metadata = 20;
}

message GetGridConfigRequest {}

message GetGridConfigResponse {
  bool success = 1;
  string message = 2;
  GridSynthesisConfig config = 3;
}

message GetGridDataRequest {}

message GetGridDataResponse {
  bool success = 1;
  string message = 2;
  GridData grid_data = 3;
}

service DataSynthesizerService {
  rpc ConfigureAndSynthesize(GridSynthesisRequest) returns (GetGridDataResponse);
  rpc GetGridConfig(GetGridConfigRequest) returns (GetGridConfigResponse);
  rpc GetGridData(GetGridDataRequest) returns (GetGridDataResponse);
  rpc GetSynthesizedGrid(GetGridDataRequest) returns (GetGridDataResponse);
}
