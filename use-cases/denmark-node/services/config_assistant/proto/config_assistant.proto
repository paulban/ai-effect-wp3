syntax = "proto3";

package config_assistant;

service ConfigAssistant {
  // Validate the user request and produce a normalized topology run config.
  rpc BuildRunConfig(BuildRunConfigRequest) returns (BuildRunConfigResponse);
}

message BuildRunConfigRequest {
  string prompt = 1;
  string run_name = 2;
  repeated string supplies = 3;
  repeated string loads = 4;
  bool allow_hx = 5;
  bool allow_bypass = 6;
}

message BuildRunConfigResponse {
  string run_name = 1;
  string config_format = 2;
  string topology_file = 3;
  repeated string supplies = 4;
  repeated string loads = 5;
  bool valid = 6;
  repeated string warnings = 7;
}
