# Session proxy for the Dutch node.
#
# This is the node's single entry point and the only container that publishes a
# host port. It does three jobs:
#
#   1. Gives every participant-facing surface one origin, which removes the
#      cross-origin POST that silently lost session traces (FR-17).
#   2. Validates the signed session link before anything reaches a session
#      container, and exchanges the token for a cookie so it does not persist
#      in access logs, history or referrer headers (FR-15, FR-16).
#   3. Routes /s/<session-id>/ to whichever pool slot is serving that session,
#      learned from the control service rather than from the Docker daemon —
#      so this proxy needs no socket (FR-14).
#
# Slots are statically declared in docker-compose.yml, so nothing here has to
# discover containers at runtime.

# Docker's embedded DNS. Needed because the upstream address comes from a
# variable, which makes nginx resolve it per request instead of at startup.
resolver 127.0.0.11 valid=10s ipv6=off;

# Session cookie lifetime. Shorter than the token's own expiry, which remains
# the real authority — the cookie only saves re-presenting the token.
map $host $session_cookie_max_age { default 14400; }

log_format session_safe '$remote_addr - [$time_local] "$request_method $uri" '
                        '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name _;

    # The query string is deliberately absent from $uri, so a session token
    # presented as ?t=... never reaches the log (FR-16).
    access_log /var/log/nginx/access.log session_safe;

    client_max_body_size 32m;

    # ---------------------------------------------------------------------
    # Participant session routes
    # ---------------------------------------------------------------------

    # First contact carries the token in the query string. Move it into a
    # cookie and redirect to the clean URL, so the token stops travelling in
    # anything that gets logged or forwarded.
    location ~ ^/s/(?<session_id>[a-zA-Z0-9_-]+)/(?<tool>gui|survey)(?<rest>/.*)?$ {
        # The cookie name is fixed rather than per-session: nginx cannot compose
        # a variable name like $cookie_hai_session_$session_id, so a per-session
        # name would be unreadable on the way back in. Path scoping keeps it
        # unambiguous — a browser holding two sessions sends only the cookie
        # whose path matches the session being addressed.
        if ($arg_t) {
            add_header Set-Cookie "hai_session=${arg_t}; Path=/s/${session_id}/; HttpOnly; SameSite=Lax; Max-Age=${session_cookie_max_age}" always;
            return 302 $scheme://$http_host$uri;
        }

        auth_request /internal/authorize;
        auth_request_set $slot_upstream $upstream_http_x_slot_upstream;

        # Strip the /s/<id>/<tool> prefix; the tool is served at its own root.
        # X-Forwarded-Prefix tells it what to prepend when generating links,
        # which is what ProxyFix(x_prefix=1) consumes on the simulator side.
        #
        # The URI part is always supplied explicitly. When proxy_pass uses a
        # variable and carries no URI, nginx forwards the *original* request
        # URI — so the tool would receive /s/<id>/<tool>/… and 404 on
        # everything. An empty capture therefore has to become "/".
        set $upstream_path $rest;
        if ($upstream_path = "") {
            set $upstream_path "/";
        }
        proxy_pass http://$slot_upstream$upstream_path$is_args$args;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /s/$session_id/$tool;

        # The simulator streams its episode over a long-lived SSE response, so
        # buffering must be off and the read timeout must outlast a session.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Internal subrequest target. `internal` makes it unreachable from outside;
    # only nginx's own auth_request can call it.
    location = /internal/authorize {
        internal;

        proxy_pass http://hai-testing-service:8080/internal/authorize-session?session_id=$session_id&tool=$tool&token=$cookie_hai_session;

        # An authorisation subrequest must not carry the participant's body.
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # ---------------------------------------------------------------------
    # WP3 collect endpoints
    #
    # Same origin as the tools above, which is what makes the browser's POST
    # of the session trace an ordinary same-origin request rather than a CORS
    # preflight that used to fail (FR-17, FR-18).
    # ---------------------------------------------------------------------
    location /wp3/collect/ {
        proxy_pass http://hai-testing-service:8080/collect/;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------------------
    # InteractiveAI CAB platform
    #
    # Declared in the CAB stack's own compose file but attached to the same
    # network, so it is reachable by name. Routed here so the control room and
    # the session tools share one origin.
    # ---------------------------------------------------------------------
    location / {
        # Assigned to a variable so nginx resolves it per request rather than
        # at startup. With a literal hostname here, nginx refuses to start at
        # all when the CAB stack is down — taking session routing with it, even
        # though sessions do not depend on CAB being up. As a variable, a CAB
        # outage degrades to a 502 on this route only.
        set $cab_upstream "frontend:80";
        proxy_pass http://$cab_upstream;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The control room uses websockets for card updates.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Unauthenticated liveness probe for the proxy itself.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
