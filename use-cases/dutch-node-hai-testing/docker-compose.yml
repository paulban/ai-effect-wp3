# Dutch node — Human-AI Interaction (HAI) sessions.
#
# Build from this directory: `docker compose up -d --build`. The build context
# is ../ (use-cases/) so the shared control-plane package can be copied into
# the image alongside the service's own code, as for benchmarking.
#
# The InteractiveAI stack (backend, frontend, PowerGrid simulator) is NOT
# started here. It is a separate stack, set up once with
# scripts/setup_interactiveai.sh, which also connects its containers to the
# ai-effect-services network so that:
#   - cab_recommendation reaches this service's agent endpoint by name
#     (RL_AGENT_API_URL=http://hai-session-runner:8080/api/v1/recommendation);
#   - this service reaches the gateway (frontend:80) and the simulator by name.
#
# Like benchmarking, the service publishes a loopback port so a result
# reference is fetchable from this machine. That is a development convenience;
# HAI_SELF_URL names the node's proxy route in a deployment that has one.

services:
  hai-session-runner:
    build:
      context: ..
      dockerfile: dutch-node-hai-testing/services/human_ai_interaction_testing/Dockerfile
    image: ghcr.io/ai-effect/dutch-node-hai-testing:latest
    container_name: hai-session-runner
    restart: unless-stopped
    environment:
      # Bearer token on /control/*. Unset means open, which is acceptable only
      # on a developer machine.
      - SERVICE_API_KEY=${SERVICE_API_KEY:-}
      - SELF_URL=${HAI_SELF_URL:-http://localhost:${HAI_HOST_PORT:-8005}}
      - ARTIFACT_DIR=/artifacts
      # One session at a time (spec FR-05). Do not raise.
      - MAX_CONCURRENT_JOBS=1
      # Bearer token cab_recommendation sends to the agent endpoint. Must equal
      # the RL_AGENT_API_TOKEN the setup script gave it (same variable there).
      - HAI_AGENT_TOKEN=${HAI_AGENT_TOKEN:-}
      - HAI_AGENT_ACT_TIMEOUT_SECONDS=${HAI_AGENT_ACT_TIMEOUT_SECONDS:-20}
      # InteractiveAI as this service reaches it, over ai-effect-services.
      - HAI_CAB_INTERNAL_URL=${HAI_CAB_INTERNAL_URL:-http://frontend:80}
      - HAI_SIMULATOR_INTERNAL_URL=${HAI_SIMULATOR_INTERNAL_URL:-http://PowerGrid-simulator-app:5000}
      # InteractiveAI as the participant's browser reaches it.
      - HAI_FRONTEND_PUBLIC_URL=${HAI_FRONTEND_PUBLIC_URL:-http://localhost:3200}
      - HAI_SIMULATOR_PUBLIC_URL=${HAI_SIMULATOR_PUBLIC_URL:-http://localhost:5122}
      # Server the participant picks in the simulator's login, as the
      # simulator container reaches the gateway.
      - HAI_SIMULATOR_CAB_SERVER=${HAI_SIMULATOR_CAB_SERVER:-http://host.docker.internal:3200/}
      # The InteractiveAI test account; there is no per-participant login yet.
      - HAI_CAB_USERNAME=${HAI_CAB_USERNAME:-powergrid_user}
      - HAI_CAB_PASSWORD=${HAI_CAB_PASSWORD:-test}
      - HAI_TRACE_WINDOW_MARGIN_SECONDS=${HAI_TRACE_WINDOW_MARGIN_SECONDS:-900}
      # Recorded in each result; the setup script prints the value to export.
      - HAI_INTERACTIVEAI_COMMIT=${HAI_INTERACTIVEAI_COMMIT:-}
      # Where the scenarios mount sits inside the simulator (simulator.override.yml).
      - HAI_SIMULATOR_ENV_PREFIX=Ressources/hai_scenarios
      - HAI_SIMULATOR_CONFIG_PATH=/app/runtime/CONFIG.toml
    ports:
      # Loopback only, for fetching results on this machine.
      - "127.0.0.1:${HAI_HOST_PORT:-8005}:8080"
    volumes:
      # Results outlive the container.
      - hai_artifacts:/artifacts
      # Algorithms and scenarios a request selects by name. Read-only: the
      # service never writes to them. The simulator mounts the same scenarios.
      - ./services/human_ai_interaction_testing/algorithms:/app/algorithms:ro
      - ./services/human_ai_interaction_testing/scenarios:/app/scenarios:ro
      # The simulator's CONFIG.toml, shared with PowerGrid-simulator-app.
      # A single-file mount: the file must exist before `up` (the setup script
      # creates it), or Docker creates a directory here instead.
      - ./runtime/simulator/CONFIG.toml:/app/runtime/CONFIG.toml
    networks:
      - services
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  hai_artifacts:

networks:
  services:
    name: ai-effect-services
    external: true
