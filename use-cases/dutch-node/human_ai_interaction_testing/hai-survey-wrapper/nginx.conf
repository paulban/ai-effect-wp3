server {
    listen 80;
    server_name _;

    # Static survey files and wrapper page — served from /usr/share/nginx/html/
    # Layout inside the image:
    #   /usr/share/nginx/html/index.html          → wrapper page (FR-16)
    #   /usr/share/nginx/html/html/surveychainer.html
    #   /usr/share/nginx/html/html/workload/nasa_tlx.html  … etc.
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Proxy /api/ calls to the Flask sidecar running on port 5000 (FR-17, FR-18).
    # The wrapper page posts survey results to /api/save_results via fetch().
    location /api/ {
        proxy_pass         http://127.0.0.1:5000/api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Standard nginx error log configuration
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
